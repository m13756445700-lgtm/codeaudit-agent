name: codeaudit-final
env_file:
- .env
- .runtime.env
agents:
  auditor:
    provider: codex
    image: codeaudit-final:2.0
    driver:
      docker: {}
    env:
      PYTHONPATH: /opt/codeaudit
      CODEAUDIT_WORKSPACES: /workspaces
      CODEAUDIT_MCP_URL: ${CODEAUDIT_MCP_URL}
      CODEAUDIT_OCTOBUS_TOKEN:
        value: ${CODEAUDIT_OCTOBUS_TOKEN}
        secret: true
      CODEAUDIT_LLM_API_ENDPOINT: ${LLM_API_ENDPOINT}
      CODEAUDIT_LLM_MODEL: ${LLM_MODEL}
      CODEAUDIT_LLM_API_KEY:
        value: ${LLM_API_KEY}
        secret: true
    volumes:
    - type: bind
      source: /data/sandboxes/codeaudit-v2-workspaces
      target: /workspaces
    scheduler:
      enabled: true
      script: |
        function audit() {
          const result = scheduler.exec({
            command: "/opt/codeaudit-venv/bin/python",
            args: ["/opt/codeaudit/scripts/run-agent.py", "/opt/codeaudit/benchmark/cross-file-flow", "--keep-source"],
            timeoutMs: 960000,
            maxOutputBytes: 16384,
            sandboxPolicy: "new"
          });
          scheduler.log("CodeAudit V2 Engine completed", result);
          if (!result.success) throw new Error("V2 audit failed; inspect scheduler logs");
          return result;
        }
        function main(payload) { return audit(); }
        scheduler.cron("daily-v2-audit", "0 9 * * *", audit, {timezone: "Asia/Shanghai"});

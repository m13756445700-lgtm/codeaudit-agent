name: Core verification
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  core:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q -p no:cacheprovider
      - run: python scripts/validate_schemas.py
      - run: docker build --build-arg BUILD_SHA=${{ github.sha }} --platform linux/amd64 -t codeaudit-ci:${{ github.sha }} .
      - run: python scripts/docker_smoke.py codeaudit-ci:${{ github.sha }}

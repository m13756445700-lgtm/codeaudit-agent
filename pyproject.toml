[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "codeaudit-agent"
version = "2.0.0"
description = "Evidence-driven agentic code security auditing with MCP tools"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.9"
dependencies = ["jsonschema==4.23.0", "PyYAML==6.0.2", "javalang==0.13.0", "defusedxml==0.7.1"]

[project.scripts]
codeaudit = "agent.cli:main"

[tool.setuptools.packages.find]
include = ["agent*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

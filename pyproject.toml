[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "codeaudit-agent"
version = "1.0.0"
requires-python = ">=3.9"
dependencies = ["jsonschema==4.23.0", "PyYAML==6.0.2", "javalang==0.13.0", "defusedxml==0.7.1"]

[project.scripts]
codeaudit = "agent.cli:main"

[tool.setuptools.packages.find]
include = ["agent*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
